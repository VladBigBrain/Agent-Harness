version = 1

[[tools]]
id = "ruff-check"
class = "lint"
kind = "python-module"
runtime = "target"
module = "ruff"
args = ["check", "--no-cache", "{scopes}"]
profiles = ["review", "verification"]
reviewer_lanes = ["style", "simplification", "errors", "performance"]
timeout_seconds = 300

[[tools]]
id = "ruff-format-check"
class = "style"
kind = "python-module"
runtime = "target"
module = "ruff"
args = ["format", "--check", "--no-cache", "{scopes}"]
profiles = ["review", "verification"]
reviewer_lanes = ["style"]
timeout_seconds = 300

[[tools]]
id = "mypy"
class = "types"
kind = "python-module"
runtime = "target"
module = "mypy"
args = ["--no-incremental", "--explicit-package-bases", "--no-pretty", "{scopes}"]
profiles = ["review", "verification"]
reviewer_lanes = ["types", "architecture", "async"]
timeout_seconds = 600

[[tools]]
id = "radon-complexity"
class = "quality"
kind = "python-module"
runtime = "harness"
module = "radon"
args = ["cc", "--show-complexity", "--average", "{scopes}"]
profiles = ["review", "verification"]
reviewer_lanes = ["performance", "simplification", "oop"]
timeout_seconds = 300

[[tools]]
id = "bandit"
class = "security"
kind = "python-module"
runtime = "harness"
module = "bandit"
args = ["-r", "-q", "-f", "json", "{scopes}"]
profiles = ["review", "verification"]
reviewer_lanes = ["security", "errors"]
timeout_seconds = 600

[[tools]]
id = "architecture-cycles"
class = "architecture"
kind = "script"
script = "scripts/architecture_check.py"
args = ["--target", "{target}", "--scope", "{scope_each}"]
profiles = ["review", "verification"]
reviewer_lanes = ["architecture", "oop"]
timeout_seconds = 300

[[tools]]
id = "pytest"
class = "tests"
kind = "python-module"
runtime = "target"
module = "pytest"
args = ["-p", "no:cacheprovider", "{test_options}", "{tests}"]
profiles = ["review", "verification"]
reviewer_lanes = ["tests"]
requires_tests = true
timeout_seconds = 1800

[[tools]]
id = "codex-security"
class = "security"
kind = "agent-capability"
profiles = ["review", "verification"]
reviewer_lanes = ["security"]
rationale = "Orchestration invokes this capability and routes normalized output to the security lane; no standalone local CLI exists."

[[tools]]
id = "pip-audit"
class = "dependencies"
kind = "unavailable"
profiles = ["review", "verification"]
reviewer_lanes = ["dependencies", "security"]
rationale = "Live advisory resolution may require network/private-index access; disabled for this isolated run."

[[tools]]
id = "sonar"
class = "quality-security"
kind = "unavailable"
profiles = ["review", "verification"]
reviewer_lanes = ["architecture", "performance", "security", "simplification", "style"]
rationale = "The target has Sonar configuration but no approved local server, scanner, or credential-free offline mode."
